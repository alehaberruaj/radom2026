<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radom — Recorrido por la memoria</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #111111; --surface: #1C1C1C; --surface2: #252525;
    --text: #F0EDE8; --text-dim: #A09A93;
    --red: #8B2020; --red-light: #C0392B; --border: #2E2E2E;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; }
  #header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 18px 12px; }
  #header h1 { font-family: var(--font-serif); font-size: 18px; font-weight: normal; color: var(--text); letter-spacing: 0.02em; }
  #header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.05em; text-transform: uppercase; }
  #map { position: fixed; top: 65px; left: 0; right: 0; bottom: 0; z-index: 1; }
  .leaflet-tile-pane { filter: grayscale(100%) brightness(0.35) contrast(1.1); }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { font-size: 9px; opacity: 0.3; }
  .marker-wrap { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .marker-bubble { width: 38px; height: 38px; border-radius: 50%; background: var(--red); border: 2px solid #F0EDE8; display: flex; align-items: center; justify-content: center; font-family: var(--font-ui); font-size: 15px; font-weight: 700; color: #F0EDE8; box-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  .marker-bubble.familia { background: #1A3A5C; border-color: #7EB3D8; }
  .marker-label { margin-top: 4px; background: rgba(17,17,17,0.85); color: var(--text-dim); font-size: 10px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; letter-spacing: 0.03em; }
  .marker-label.familia { color: #7EB3D8; }
  #panel { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; background: var(--surface); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.4,0,0.2,1); max-height: 82vh; display: flex; flex-direction: column; }
  #panel.open { transform: translateY(0); }
  #panel-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
  #panel-header { padding: 14px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #panel-number { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red-light); margin-bottom: 4px; }
  #panel-number.familia-color { color: #7EB3D8; }
  #panel-title { font-family: var(--font-serif); font-size: 20px; color: var(--text); line-height: 1.25; }
  #panel-address { font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.02em; }
  #panel-close { background: var(--surface2); border: none; color: var(--text-dim); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  #panel-body { overflow-y: auto; padding: 20px 20px 40px; flex: 1; -webkit-overflow-scrolling: touch; }
  #panel-body p { font-family: var(--font-serif); font-size: 19px; line-height: 1.65; color: var(--text); margin-bottom: 20px; }
  #panel-body p.destacado { background: var(--surface2); border-left: 3px solid var(--red); padding: 12px 14px; font-size: 17px; line-height: 1.5; }
  #panel-body p.destacado.familia-border { border-color: #7EB3D8; }
  .foto-bloque { margin-bottom: 24px; }
  .foto-bloque img { width: 100%; display: block; border-radius: 6px; }
  .foto-caption { font-family: var(--font-ui); font-size: 12px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.03em; line-height: 1.4; font-style: italic; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; }
  #overlay.show { display: block; }
  #legend { position: fixed; bottom: 20px; left: 16px; z-index: 900; display: flex; flex-direction: column; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-dim); letter-spacing: 0.03em; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid; flex-shrink: 0; }
  .legend-dot.hist { background: var(--red); border-color: #F0EDE8; }
  .legend-dot.fam { background: #1A3A5C; border-color: #7EB3D8; }
</style>
</head>
<body>
<div id="header">
  <h1>Radom — Recorrido por la memoria</h1>
  <p>Tocá cada parada para leer su historia</p>
</div>
<div id="map"></div>
<div id="overlay"></div>
<div id="panel">
  <div id="panel-handle"></div>
  <div id="panel-header">
    <div>
      <div id="panel-number"></div>
      <div id="panel-title"></div>
      <div id="panel-address"></div>
    </div>
    <button id="panel-close" onclick="closePanel()">×</button>
  </div>
  <div id="panel-body"></div>
</div>
<div id="legend">
  <div class="legend-item"><div class="legend-dot hist"></div> Sitio histórico</div>
  <div class="legend-item"><div class="legend-dot fam"></div> Casa de familia</div>
</div>
<script>
const BASE = 'https://alehaberruaj.github.io/radom2026/fotos/';

const PARADAS = [
  {
    id: 1, tipo: "historico",
    nombre: "La entrada al ghetto",
    direccion: "Wałowa & Żeromskiego",
    lat: 51.4024, lng: 21.1469,
    fotos: [
      { src: BASE + 'foto_entrada_historica.jpg', caption: 'Plac Stare Miasto, dentro del Ghetto Grande, circa 1941. Al fondo, la iglesia de la Santísima Trinidad, que sigue en pie hoy.' }
    ],
    contenido: [
      { tipo: "destacado", texto: "Antes de la guerra, Radom tenía unos 30.000 habitantes judíos — aproximadamente el 30% de la población total de la ciudad." },
      { tipo: "normal", texto: "El 8 de septiembre de 1939 las fuerzas alemanas ocuparon Radom. En marzo de 1941 el gobernador alemán emitió un decreto estableciendo dos ghettos separados. Los judíos tuvieron diez días para abandonar sus viviendas y trasladarse a las zonas designadas." },
      { tipo: "normal", texto: "El Ghetto Grande se estableció en torno a la calle Wałowa y las calles adyacentes del centro. Albergó a unos 27.000 judíos. El Ghetto Chico se ubicó en el barrio periférico de Glinice, con unos 5.000 habitantes." },
      { tipo: "normal", texto: "A diferencia del ghetto de Varsovia, el de Radom no tenía muros. Los límites estaban marcados por los propios edificios del perímetro. El ghetto tenía 13 portones custodiados por policía judía y polaca, con carteles que decían: Peligro — Enfermedades contagiosas — Prohibida la entrada." },
      { tipo: "normal", texto: "Las condiciones dentro del ghetto eran de hacinamiento extremo. La ración alimentaria asignada por los alemanes era de 100 gramos de pan por persona por día. Las enfermedades se propagaban con rapidez, en particular el tifus." },
    ]
  },
  {
    id: 2, tipo: "familia",
    nombre: "Wałowa — centro del ghetto",
    direccion: "Wałowa 1 (entrar al patio interior) · Wałowa 11a",
    lat: 51.4016, lng: 21.1433,
    fotos: [],
    contenido: [
      { tipo: "normal", texto: "Wałowa era el eje central de la vida judía de Radom desde el siglo XVIII. Acá estaban concentradas las tiendas, los talleres, los shtiebels (pequeñas sinagogas), la mikve y los negocios de la comunidad. El Judenrat — el consejo judío obligado por los alemanes a administrar el ghetto — también tenía su sede en esta zona." },
      { tipo: "normal", texto: "En el patio interior del número 1 se conserva un cartel pintado directamente sobre la pared en yiddish: es el aviso del hotel y restaurante kosher de Abram Mentlik, del período de entreguerras. Es uno de los pocos vestigios físicos de la vida comercial judía que sobrevivió en la ciudad." },
      { tipo: "destacado", texto: "En el número 11a vivían Miriam Basia Mekler Kiman y sus hijos — tus medios hermanos. Tu papá Lejbus Mekler se escapó antes de que se formara el ghetto." },
      { tipo: "normal", texto: "Durante la liquidación del Ghetto Grande, en agosto de 1942, los habitantes fueron concentrados en Wałowa y la plaza del mercado antes de ser deportados. Lo más probable es que Miriam Basia y los hijos hayan sido parte de esa deportación." },
      { tipo: "normal", texto: "La liquidación del Ghetto Grande se ejecutó entre el 16 y el 18 de agosto de 1942. Unidades de las SS, la Gestapo, gendarmes alemanes y fuerzas auxiliares ucranianas rodearon el ghetto. Operaron de noche, con reflectores instalados en las esquinas. Sacaron a los habitantes edificio por edificio. Quienes resistían eran ejecutados en el lugar. Los demás fueron formados en columnas y llevados a pie hasta un desvío ferroviario junto a la fábrica Marwil, donde los subieron a vagones de carga con destino a Treblinka." },
      { tipo: "normal", texto: "En tres noches fueron deportadas unas 25.000 personas. La casi totalidad fue asesinada en Treblinka." },
    ]
  },
  {
    id: 3, tipo: "familia",
    nombre: "Los que quedaron",
    direccion: "Szwarlikowska",
    lat: 51.4039, lng: 21.1426,
    fotos: [],
    contenido: [
      { tipo: "normal", texto: "Tras la liquidación de agosto de 1942, los alemanes retuvieron a unos 2.000 judíos considerados útiles como mano de obra. Fueron concentrados en esta calle, que quedó convertida en un campo de trabajo forzado — Zwangs-Arbeits-Lager. El resto del ghetto fue vaciado." },
      { tipo: "destacado", texto: "Tu mamá Jacheta Wajsbort, que vivía en Mireckiego 8/10, fue una de las personas seleccionadas para permanecer en este campo." },
      { tipo: "normal", texto: "Los trabajadores del campo de Szwarlikowska fueron empleados principalmente en la fábrica de armamentos Steyer-Daimler-Puch y en talleres de sastrería, zapatería y relojería. El campo fue liquidado en noviembre de 1942: parte de los prisioneros fueron trasladados al nuevo campo de la calle Szkolna, otros enviados a los campos de Płaszów y Ostrowiec Świętokrzyski." },
      { tipo: "normal", texto: "El campo de Szkolna operó hasta julio de 1944, cuando los prisioneros restantes fueron evacuados a pie hacia Tomaszów Mazowiecki y de ahí en tren a Auschwitz." },
    ]
  },
  {
    id: 4, tipo: "historico",
    nombre: "El monumento — sitio de la Gran Sinagoga",
    direccion: "Bóżniczna 3",
    lat: 51.401, lng: 21.1431,
    fotos: [
      { src: BASE + 'foto_monumento.jpg', caption: 'El monumento hoy. Las piedras de la base son fragmentos de la sinagoga y lápidas del cementerio destruidos por los nazis. Foto: Center for Jewish Art, Hebrew University of Jerusalem.' }
    ],
    contenido: [
      { tipo: "normal", texto: "En este terreno estuvo la Gran Sinagoga de Radom, construida en el siglo XIX. Los alemanes la incendiaron en septiembre de 1939, poco después de ocupar la ciudad. Las ruinas fueron demolidas por orden del gobierno comunista polaco en la posguerra." },
      { tipo: "normal", texto: "En 1947 los sobrevivientes judíos que quedaban en Radom iniciaron una colecta para construir un monumento. El autor fue un escultor local que había sobrevivido el Holocausto. Utilizó materiales recuperados de las ruinas de la sinagoga y fragmentos de lápidas del cementerio judío destruido por los nazis." },
      { tipo: "destacado", texto: "El monumento fue inaugurado el 8 de agosto de 1950, en el aniversario de la liquidación del Ghetto Grande. Es un obelisco truncado con la figura en relieve de una mujer con el puño levantado. Las placas dicen en yiddish: Judíos de Radom, víctimas del hitlerismo bárbaro. En polaco: A los judíos de Radom, víctimas de los crímenes de Hitler." },
      { tipo: "normal", texto: "Para 1948 prácticamente no quedaban judíos en Radom. La comunidad judía de la ciudad, que en 1939 tenía 30.000 personas, dejó de existir." },
    ]
  },
  {
    id: 5, tipo: "familia",
    nombre: "La casa de tu mamá",
    direccion: "Mireckiego 8/10",
    lat: 51.4068, lng: 21.1416,
    fotos: [],
    contenido: [
      { tipo: "destacado", texto: "En este edificio vivía tu mamá Jacheta Wajsbort, junto con su mamá y unos primos." },
      { tipo: "normal", texto: "La calle Mireckiego estaba dentro del perímetro del Ghetto Grande. Cuando el ghetto fue sellado en abril de 1941, Jacheta y su familia ya estaban dentro de la zona designada." },
      { tipo: "normal", texto: "Durante la liquidación de agosto de 1942, Jacheta fue seleccionada para permanecer como mano de obra y trasladada al campo de trabajo de Szwarlikowska. No sabemos qué fue de su mamá y sus primos." },
    ]
  }
];

const map = L.map('map', { center: [51.4035, 21.1438], zoom: 16, zoomControl: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

PARADAS.forEach(p => {
  const esFamilia = p.tipo === 'familia';
  const html = `<div class="marker-wrap"><div class="marker-bubble ${esFamilia ? 'familia' : ''}">${p.id}</div><div class="marker-label ${esFamilia ? 'familia' : ''}">${p.nombre.split('—')[0].trim()}</div></div>`;
  const icon = L.divIcon({ html, className: '', iconSize: [120, 60], iconAnchor: [60, 19] });
  L.marker([p.lat, p.lng], { icon }).addTo(map).on('click', () => openPanel(p));
});

function openPanel(parada) {
  const esFamilia = parada.tipo === 'familia';
  document.getElementById('panel-number').textContent = `PARADA ${parada.id}`;
  document.getElementById('panel-number').className = esFamilia ? 'familia-color' : '';
  document.getElementById('panel-title').textContent = parada.nombre;
  document.getElementById('panel-address').textContent = parada.direccion;

  const body = document.getElementById('panel-body');
  body.innerHTML = '';

  if (parada.fotos && parada.fotos.length > 0) {
    parada.fotos.forEach(foto => {
      const bloque = document.createElement('div');
      bloque.className = 'foto-bloque';
      const img = document.createElement('img');
      img.src = foto.src;
      img.alt = foto.caption;
      img.loading = 'lazy';
      bloque.appendChild(img);
      if (foto.caption) {
        const cap = document.createElement('p');
        cap.className = 'foto-caption';
        cap.textContent = foto.caption;
        bloque.appendChild(cap);
      }
      body.appendChild(bloque);
    });
  }

  parada.contenido.forEach(bloque => {
    const el = document.createElement('p');
    el.textContent = bloque.texto;
    if (bloque.tipo === 'destacado') el.className = esFamilia ? 'destacado familia-border' : 'destacado';
    body.appendChild(el);
  });

  body.scrollTop = 0;
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  map.panTo([parada.lat, parada.lng], { animate: true });
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('overlay').addEventListener('click', closePanel);
let startY = 0;
document.getElementById('panel').addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
document.getElementById('panel').addEventListener('touchend', e => { if (e.changedTouches[0].clientY - startY > 60) closePanel(); });
</script>
</body>
</html>
